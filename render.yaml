services:
  - type: web
    name: food-order-agent-backend
    runtime: python
    region: ohio
    plan: free
    branch: main
    buildCommand: ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /health/
    autoDeployTrigger: commit
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_AGENT_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_TTS_MODEL
        value: gemini-3.1-flash-tts-preview
      - key: GEMINI_TTS_VOICE
        value: Sulafat
      - key: CORS_ALLOWED_ORIGINS
        value: https://food-order-agent-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://food-order-agent-frontend.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: WEB_CONCURRENCY
        value: "1"
